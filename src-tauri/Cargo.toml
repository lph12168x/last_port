[package]
name = "last_port"
version = "0.1.0"
description = "跨平台现代串口工具"
authors = ["last_port"]
edition = "2021"
rust-version = "1.77"

# 主库模块名,Tauri 2 推荐把逻辑放在 lib.rs,桌面/移动入口共享
[lib]
name = "last_port_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serialport = { version = "4.6", default-features = false, features = ["serde", "libudev"] }
thiserror = "1"

[dev-dependencies]
# 集成测试 (PTY 回环) — 默认不跑,见 tests/integration.rs
nix = { version = "0.29", features = ["fs", "term"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
