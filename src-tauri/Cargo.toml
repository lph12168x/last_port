[package]
name = "last_port"
version = "0.1.0"
description = "跨平台现代串口工具"
authors = ["last_port"]
edition = "2021"
rust-version = "1.77"

# 主库模块名,Tauri 2 推荐把逻辑放在 lib.rs,桌面/移动入口共享
[lib]
name = "last_port_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["wry"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_repr = "0.1"
serialport = { version = "4.6", default-features = false, features = ["serde", "libudev"] }
thiserror = "1"

# Tauri 2 canonical features: 默认启用 custom-protocol 使 release 构建嵌入前端资产
# (codegen 在 dev && devUrl.is_some() 时会生成空资产,必须开 custom-protocol 才会嵌 dist)
# `tauri dev` 会通过 --no-default-features + 过滤逻辑自动剥离它,dev 模式仍走 devUrl
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[dev-dependencies]
# 集成测试 (PTY 回环) — 默认不跑,见 tests/integration.rs
nix = { version = "0.29", features = ["fs", "term"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
