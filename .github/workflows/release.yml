name: release

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            os: ubuntu-22.04
            # 用 --ci 而不是 --bundles deb,appimage: tauri 2.11.x CLI 在
            # 解析 --bundles 时有 bug ("invalid value '1' for '--ci'"),
            # --ci 自动按 tauri.conf.json bundle.targets=all 出 deb+rpm+appimage
            args: --ci
          - platform: macos
            os: macos-latest
            args: --ci
          - platform: windows
            os: windows-latest
            # Windows: portable exe only (zip). Win11 自带 WebView2;
            # Win10 用户需手动装一次:
            # https://developer.microsoft.com/microsoft-edge/webview2/
            args: --no-bundle

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: Install Linux system dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential curl wget file \
            libxdo-dev libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config libudev-dev

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - name: Install Node dependencies
        run: npm ci

      # 必须先 build 前端: src-tauri/tauri.conf.json 的 frontendDist 指向 ../dist,
      # 而 dist/ 在 .gitignore 里 — CI 工作树初始没有 dist/。
      # cargo test --lib 里 tauri::generate_context!() 会把 ../dist 嵌入二进制,
      # 路径不存在则 proc-macro panic ("frontendDist ... doesn't exist")。
      # tauri 自身的 tauri:build 会经 beforeBuildCommand 跑 npm run build,
      # 但 cargo test --lib 不走 tauri-build, 需要显式补。
      - name: Build frontend (so generate_context! finds dist/)
        run: npm run build

      - name: Rust unit tests
        working-directory: src-tauri
        run: cargo test --lib
      - name: Rust integration tests (PTY loopback)
        if: matrix.platform == 'linux'
        working-directory: src-tauri
        run: cargo test --test integration -- --ignored

      - name: Frontend unit tests
        run: npm test

      # tauri build 阶段自带 beforeBuildCommand: npm run build, 复用上面 (第 75 行) 的产物即可.
      - name: Tauri bundle
        run: npx tauri build ${{ matrix.args }}

      # Linux/macOS 平台标准包(.deb / .dmg)对 Windows 用户或习惯 tar 的人
      # 不友好 — 7-Zip/WinRAR 打开 .deb 会看到内层 data.tar.xz 让用户以为要解压两次.
      # 这里多产一个平铺的 tar.gz: 内含主二进制 + .desktop + 图标 + README,
      # 一次 tar xzf 就能直接跑. Linux/macOS 用户可选用.
      - name: Package Linux portable tarball
        if: matrix.platform == 'linux'
        shell: bash
        run: |
          set -e
          src="src-tauri/target/release"
          stage="portable-linux"
          rm -rf "$stage"
          mkdir -p "$stage"
          cp "$src/last_port" "$stage/last_port"
          chmod +x "$stage/last_port"
          [ -d "$src/bundle/deb/last_port_0.1.0_amd64/data" ] && cp -r "$src/bundle/deb/last_port_0.1.0_amd64/data/usr" "$stage/" || true
          [ -f README.md ] && cp README.md "$stage/"
          tar -czf last_port-linux-x86_64.tar.gz -C "$stage" .
          echo "=== Tarball contents ==="
          tar -tzf last_port-linux-x86_64.tar.gz | head -20
          ls -lh last_port-linux-x86_64.tar.gz

      - name: Package macOS portable tarball
        if: matrix.platform == 'macos'
        shell: bash
        run: |
          set -e
          src="src-tauri/target/release"
          # macOS bundle 在 bundle/macos/last_port.app/
          app_path=$(find "$src/bundle/macos" -name '*.app' -type d 2>/dev/null | head -1)
          if [ -n "$app_path" ]; then
            tar -czf last_port-macos.tar.gz -C "$(dirname "$app_path")" "$(basename "$app_path")"
            ls -lh last_port-macos.tar.gz
          else
            echo "::warning::no .app bundle found, skipping macOS tarball"
          fi

      - name: List bundle artifacts
        if: success()
        working-directory: src-tauri
        shell: bash
        run: |
          echo "=== Bundle artifacts ==="
          if [ -d target/release/bundle ]; then
            find target/release/bundle -type f \
              \( -name '*.deb' -o -name '*.dmg' -o -name '*.msi' \
                 -o -name '*.exe' -o -name '*.appimage' \
                 -o -name '*.app' -o -name '*.pkg' \
              \) -exec ls -lh {} + || true
          else
            echo "(no bundle directory — Windows portable zip uses --no-bundle)"
          fi
          echo "=== Portable tarballs (in repo root) ==="
          if [ "${{ matrix.platform }}" = "linux" ]; then
            ls -lh ../last_port-linux-x86_64.tar.gz 2>/dev/null || echo "(linux tarball not built)"
          elif [ "${{ matrix.platform }}" = "macos" ]; then
            ls -lh ../last_port-macos.tar.gz 2>/dev/null || echo "(macos tarball not built)"
          else
            echo "(no portable tarball on windows)"
          fi
          echo "=== Release binary ==="
          ls -lh target/release/last_port* 2>/dev/null || true

      # Windows GUI subsystem: 双击 last_port.exe 不弹终端.
      # tauri-cli --no-bundle 出的是 console subsystem, 用 MSVC editbin
      # 把 subsystem 改为 windows (4 == IMAGE_SUBSYSTEM_WINDOWS_GUI).
      - name: Set Windows GUI subsystem
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          if [ -f src-tauri/target/release/last_port.exe ]; then
            EDITBIN=$(find "/c/Program Files (x86)/Microsoft Visual Studio" "/c/Program Files/Microsoft Visual Studio" -name 'editbin.exe' 2>/dev/null | head -1)
            if [ -n "$EDITBIN" ]; then
              "$EDITBIN" /SUBSYSTEM:WINDOWS src-tauri/target/release/last_port.exe
              echo "Set GUI subsystem via $EDITBIN"
            else
              echo "::warning::editbin.exe not found in standard VS paths — last_port.exe may show a console window when double-clicked"
            fi
          else
            echo "last_port.exe not found, skipping subsystem set"
          fi
      - name: Package Windows portable zip
        if: matrix.platform == 'windows'
        shell: bash
        run: |
          set -e
          src="src-tauri/target/release"
          # portable 目录放 repo root,zip 时平铺 (无子目录嵌套)
          stage="portable"
          rm -rf "$stage"
          mkdir -p "$stage"
          # 主二进制 (找不到就报错)
          if [ ! -f "$src/last_port.exe" ]; then
            echo "::error::$src/last_port.exe missing — tauri build --no-bundle did not produce binary"
            exit 1
          fi
          cp "$src/last_port.exe" "$stage/"
          find "$src" -maxdepth 1 -name '*.dll' -exec cp {} "$stage/" + 2>/dev/null || true
          # 应用图标 (Windows 资源管理器显示)
          [ -f "src-tauri/icons/icon.ico" ] && cp "src-tauri/icons/icon.ico" "$stage/"
          # 用户文档
          cp "README.md" "$stage/"
          echo "=== Stage contents ==="
          ls -lh "$stage/"
          # PowerShell Compress-Archive 在 Windows runner 上
          # Git Bash 用 MSYS 路径 (/d/a/...) 但 PowerShell 用 Windows 路径 (D:\a\...)
          # 必须用 cygpath -w 转换,否则 PowerShell 找不到路径
          abs_stage_win=$(cygpath -w "$(pwd)/${stage}")
          zip_path_win=$(cygpath -w "$(pwd)/last_port-windows.zip")
          echo "PowerShell paths: stage=$abs_stage_win zip=$zip_path_win"
          # 平铺 zip: 用显式 basename 列表 (不带目录路径) 传给 Compress-Archive。
          # Get-ChildItem 通过 pipeline 时会保留 FullName 路径,导致 zip 内出现
          # 目录结构。用 -Path 接数组 + 显式文件名可保证 zip 内只有文件名。
          powershell -NoProfile -Command "Set-Location -LiteralPath '${abs_stage_win}'; \$files = @('last_port.exe', 'icon.ico', 'README.md'); Compress-Archive -Path \$files -DestinationPath '${zip_path_win}' -Force; if (Test-Path '${zip_path_win}') { Write-Host 'ZIP created' } else { Write-Host 'ZIP MISSING' }"
          echo "=== Created zip ==="
          ls -lh last_port-windows.zip
          echo "=== Zip contents (preview) ==="
          powershell -NoProfile -Command "Expand-Archive -Path '${zip_path_win}' -DestinationPath 'C:\zip_preview' -Force; Get-ChildItem 'C:\zip_preview' | Format-Table Name, Length; Remove-Item -Recurse -Force 'C:\zip_preview'"

      # 把所有产物 (deb/dmg/exe/appimage/zip/tarball) 收集到 stage/,
      # 单一 tarball 上传 (避免 v4/v5 path glob 限制 / `..` 不允许).
      # release job 只需 attach stage/dist.tar.gz.
      - name: Stage all artifacts
        shell: bash
        run: |
          set -e
          stage="dist"
          rm -rf "$stage" && mkdir -p "$stage"
          # 平台标准包
          [ -d src-tauri/target/release/bundle ] && cp -r src-tauri/target/release/bundle "$stage/bundle"
          # 平台 portable tarball / zip
          cp last_port-windows.zip            "$stage/" 2>/dev/null || true
          cp last_port-linux-*.tar.gz         "$stage/" 2>/dev/null || true
          cp last_port-macos-*.tar.gz         "$stage/" 2>/dev/null || true
          # 全部产物打包成单一 tarball 上传 (避免 v4/v5 path glob 限制 / `..` 不允许)
          # pipe 用 head 可能 broken pipe 触发 tar exit 1, 避免
          tar -czf dist.tar.gz -C "$stage" .
          ls -lhR "$stage"
          echo "=== dist.tar.gz size ==="
          ls -lh dist.tar.gz
      - name: Upload dist archive
        uses: actions/upload-artifact@v4
        with:
          name: last_port-${{ matrix.platform }}-dist
          if-no-files-found: warn
          retention-days: 30
          path: dist.tar.gz

  release:
    name: publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
    steps:
      # 把 build 阶段的 dist.tar.gz artifacts 拉下来, 解压到 release/,
      # 单一目录里包含所有平台产物, 软属性 softprops action 用单一 glob 全部 attach.
      - name: Download all dist archives
        uses: actions/download-artifact@v4
        with:
          pattern: last_port-*-dist
          path: archives

      - name: Extract dist archives
        run: |
          set -e
          mkdir -p release
          # 各自有子目录 (last_port-linux/, last_port-macos/, last_port-windows/).
          # 在 archives/ 下递归找 dist.tar.gz (可能在子目录中).
          find archives -type f -name 'dist.tar.gz' | while read -r f; do
            echo "Extracting $f"
            tar -xzf "$f" -C release
          done
          # flatten: 每个平台子目录提到 release/ 顶层, bundle/ 加平台前缀
          for plat_dir in release/last_port-linux release/last_port-macos release/last_port-windows; do
            [ -d "$plat_dir" ] || continue
            base=$(basename "$plat_dir")
            if [ -d "$plat_dir/bundle" ]; then
              mv "$plat_dir/bundle" "release/bundle-$base"
            fi
            for f in "$plat_dir"/*; do
              [ -f "$f" ] || continue
              fname=$(basename "$f")
              cp "$f" "release/$fname"
            done
            rm -rf "$plat_dir"
          done
          echo "=== Final release contents ==="
          find release -type f -exec ls -lh {} \;

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: last_port ${{ github.ref_name }}
          generate_release_notes: true
          fail_on_unmatched_files: false
          files: |
            release/bundle-*/**
            release/*.tar.gz
            release/*.zip
            release/*.deb
            release/*.dmg
            release/*.AppImage
            release/*.appimage
            release/*.app/Contents/MacOS/last_port
            release/**/*.deb
            release/**/*.dmg
            release/**/*.msi
            release/**/*.exe
            release/**/*.AppImage
            release/**/*.appimage
            # 软属性会把 workflow 名加到 path 前缀 (default._last_port...),
            # 排除之
            !release/bundle-*/default._*

  ci-status:
    name: CI status check
    needs: build
    runs-on: ubuntu-22.04
    if: always()
    steps:
      - name: Report build matrix status
        run: |
          if [ '${{ needs.build.result }}' = 'success' ]; then
            echo "All builds passed"
            exit 0
          else
            echo "One or more builds failed"
            exit 1
          fi